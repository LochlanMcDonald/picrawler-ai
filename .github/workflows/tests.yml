name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # -----------------------------------------------------------------------
  # picrawler-ai-3 (v3)
  # -----------------------------------------------------------------------
  test-v3:
    name: v3 Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: picrawler-ai-3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: picrawler-ai-3/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install test deps only — skip hardware / TTS packages that won't build on CI
          pip install pytest pytest-mock pytest-cov numpy opencv-python-headless Pillow

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-v3
          path: picrawler-ai-3/coverage.xml

  # -----------------------------------------------------------------------
  # picrawler-ai-4 (v4)
  # -----------------------------------------------------------------------
  test-v4:
    name: v4 Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: picrawler-ai-4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: picrawler-ai-4/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install test deps only — skip torch/timm (huge) and hardware packages
          pip install pytest pytest-mock pytest-cov numpy opencv-python-headless Pillow

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-v4
          path: picrawler-ai-4/coverage.xml
